name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.RealtimeAmbilight.sln

      # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails here.
      - name: Build
        run: dotnet build Jellyfin.RealtimeAmbilight.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.RealtimeAmbilight.sln --configuration Release --no-build --verbosity normal

      - name: Package
        run: ./build/package.sh

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: realtime-ambilight-plugin
          path: |
            artifacts/*.zip
            artifacts/manifest.json
          if-no-files-found: error
